data_dir = "/var/lib/vector"

# Scrape kubelet cAdvisor metrics *via apiserver node proxy*:
# https://kubernetes.default.svc/api/v1/nodes/<node>/proxy/metrics/cadvisor
[sources.cadvisor]
type = "prometheus_scrape"
endpoints = ["https://kubernetes.default.svc/api/v1/nodes/${VECTOR_SELF_NODE_NAME}/proxy/metrics/cadvisor"]
scrape_interval_secs = 30

[sources.cadvisor.auth]
strategy = "bearer"
token = "${KUBELET_TOKEN}"

[sources.cadvisor.tls]
ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

# Filter to only billing-critical metrics
[transforms.filter_billing_metrics]
type = "filter"
inputs = ["cadvisor"]
condition = '''
  .name == "container_cpu_usage_seconds_total" ||
  .name == "container_memory_working_set_bytes" ||
  .name == "container_network_receive_bytes_total" ||
  .name == "container_network_transmit_bytes_total" ||
  .name == "container_fs_usage_bytes"
'''

# Convert metrics to logs
[transforms.metric_to_log]
type = "metric_to_log"
inputs = ["filter_billing_metrics"]

# Transform Prometheus metrics to ClickHouse format
[transforms.to_clickhouse_format]
type = "remap"
inputs = ["metric_to_log"]
source = '''
  .metric_name = del(.name)
  # Extract value from counter/gauge object
  if exists(.counter) {
    .value = to_float!(.counter.value)
  } else if exists(.gauge) {
    .value = to_float!(.gauge.value)
  } else {
    .value = 0.0
  }
  .tags = del(.tags)
  del(.kind)
  del(.counter)
  del(.gauge)
'''

[sinks.clickhouse_metrics]
type = "clickhouse"
inputs = ["to_clickhouse_format"]
endpoint = "http://clickhouse:8123"
database = "observability"
table = "metrics"
skip_unknown_fields = true

[sinks.clickhouse_metrics.encoding]
timestamp_format = "unix"
