apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-init
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: clickhouse/clickhouse-server:latest
          command: ["/bin/bash", "/scripts/init.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: clickhouse-init-scripts
            defaultMode: 0755
